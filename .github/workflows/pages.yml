name: Deploy Repo Radar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate application JavaScript
        run: |
          node --input-type=module --check < app.js
          node --check lib/core.mjs
          node --check lib/catalog.mjs
          node --check lib/console-filters.mjs
          node --check lib/readme-previews.mjs
          node --check lib/official-info.mjs
          node --check scripts/stamp-build.mjs
          node --check unsupported-browser.js
          node --check scripts/collect.mjs
          node --test tests/*.test.mjs
      - name: Stamp build revision into static assets
        run: node scripts/stamp-build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

