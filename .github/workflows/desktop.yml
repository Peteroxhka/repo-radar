name: Build Repo Radar Windows
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml', 'desktop-release.md']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Windows release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish single Windows executable
        run: dotnet publish desktop/RepoRadar.csproj -c Release -o publish
      - name: Verify packaged app against the public catalog
        shell: pwsh
        run: |
          $test = Start-Process -FilePath ./publish/RepoRadar.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) {
            $log = Join-Path $env:TEMP "RepoRadar-smoke-error.txt"
            if (Test-Path $log) { Get-Content $log }
            throw "Catalog smoke test failed: $($test.ExitCode)" }
      - name: Stage window preview
        shell: pwsh
        run: Copy-Item (Join-Path ([System.IO.Path]::GetTempPath()) "RepoRadar-preview.png") "./publish/RepoRadar-preview.png" -ErrorAction Stop
      - uses: actions/upload-artifact@v4
        with:
          name: RepoRadar-Windows-preview
          path: publish/RepoRadar-preview.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RepoRadar-Windows-x64
          path: publish/RepoRadar.exe
          if-no-files-found: error

      - name: Publish Windows release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-v0.4.0
        run: |
          $tags = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing releases" }
          if ($tags -contains $env:RELEASE_TAG) { return }
          gh release create $env:RELEASE_TAG ./publish/RepoRadar.exe --target "$env:GITHUB_SHA" --title "Repo Radar for Windows v0.4.0" --notes-file desktop-release.md
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
